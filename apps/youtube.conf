# Caelestia Web App definition: YouTube
APP_ID="youtube"
APP_NAME="YouTube"
APP_GENERIC_NAME="Video Streaming"
APP_COMMENT="Videos, Livestreams und Kanäle auf YouTube ansehen."
APP_URL="https://www.youtube.com/"
APP_CATEGORIES="AudioVideo;Video;"
APP_KEYWORDS="YouTube;Video;Google;"
APP_CATALOG_CATEGORY="video"
APP_CATALOG_CATEGORIES_LIST="video;google;"

# Firefox / Wayland
MOZ_APP_REMOTINGNAME="youtube"
WINDOW_CLASS="youtube"

# Icon
ICON_NAME="youtube"
ICON_PROVIDER="dashboard-icons"
ICON_ID="youtube"
ICON_URL="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/youtube.svg"
ICON_LOCAL_FILE="$ROOT_DIR/assets/icons/youtube.svg"

# Caelestia / Hyprland
USE_OPAQUE_TAG="true"
NOTIFICATION_MATCH="YouTube"

# Catalog metadata
APP_PROVIDER="google"
APP_TAGS="video;streaming;popular;"
APP_FEATURED="true"

# Applet capability model v2 (Phase 16.1)
APPLET_AVAILABLE="true"
APPLET_DEFAULT_ENABLED="false"
APPLET_ADAPTER="media"
APPLET_SUPPORT="supported"
APPLET_CAPABILITIES="now_playing;playback_controls;live_preview;video_crop;pin;"
APPLET_MATCH_HOSTS="youtube.com;"

# Browser metadata bridge
BROWSER_BRIDGE_PORT="9341"
