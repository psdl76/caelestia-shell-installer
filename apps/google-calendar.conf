# Caelestia Web App definition: Google Calendar
APP_ID="google-calendar"
APP_NAME="Google Calendar"
APP_GENERIC_NAME="Calendar"
APP_COMMENT="Termine, Kalender und Einladungen verwalten."
APP_URL="https://calendar.google.com/"
APP_CATEGORIES="Network;Office;"
APP_KEYWORDS="Google Calendar;Google;"
APP_CATALOG_CATEGORY="google"

# Firefox / Wayland
MOZ_APP_REMOTINGNAME="google-calendar"
WINDOW_CLASS="google-calendar"

# Icon
ICON_NAME="google-calendar"
