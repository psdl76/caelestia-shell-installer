# Caelestia Web App definition: Spotify
APP_ID="spotify"
APP_NAME="Spotify"
APP_GENERIC_NAME="Music Streaming"
APP_COMMENT="Musik, Podcasts und Hörbücher streamen."
APP_URL="https://open.spotify.com/"
APP_CATEGORIES="AudioVideo;Audio;"
APP_KEYWORDS="Spotify;Music;"
APP_CATALOG_CATEGORY="music"

# Firefox / Wayland
MOZ_APP_REMOTINGNAME="spotify"
WINDOW_CLASS="spotify"

# Icon
ICON_NAME="spotify"
ICON_PROVIDER="dashboard-icons"
ICON_ID="spotify"
ICON_URL="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/spotify.svg"
ICON_LOCAL_FILE="$ROOT_DIR/assets/icons/webapp-generic.svg"

# Caelestia / Hyprland
USE_OPAQUE_TAG="true"
NOTIFICATION_MATCH="Spotify"

# Catalog metadata
APP_PROVIDER="spotify"
APP_TAGS="music;streaming;audio;popular;"
APP_FEATURED="true"

# Applet capability model v2 (Phase 16.1)
APPLET_AVAILABLE="true"
APPLET_DEFAULT_ENABLED="false"
APPLET_ADAPTER="media"
APPLET_SUPPORT="experimental"
APPLET_CAPABILITIES="now_playing;playback_controls;artwork;"
APPLET_MATCH_HOSTS="open.spotify.com;"
