# Caelestia Web App definition: Outlook
APP_ID="outlook"
APP_NAME="Outlook"
APP_GENERIC_NAME="Email"
APP_COMMENT="E-Mails und Kalender mit Outlook im Browser verwalten."
APP_URL="https://outlook.live.com/mail/"
APP_CATEGORIES="Network;Office;"
APP_KEYWORDS="Outlook;Microsoft;"
APP_CATALOG_CATEGORY="microsoft"

# Firefox / Wayland
MOZ_APP_REMOTINGNAME="outlook"
WINDOW_CLASS="outlook"

# Icon
ICON_NAME="outlook"
ICON_PROVIDER="dashboard-icons"
ICON_ID="microsoft-outlook"
ICON_URL="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/microsoft-outlook.svg"
ICON_LOCAL_FILE="$ROOT_DIR/assets/icons/webapp-generic.svg"

# Caelestia / Hyprland
USE_OPAQUE_TAG="true"
NOTIFICATION_MATCH="Outlook|Microsoft Outlook"

# Catalog metadata
APP_PROVIDER="microsoft"
APP_TAGS="microsoft;popular;"
APP_FEATURED="false"

# Applet capability model v2 (Phase 16.1)
APPLET_AVAILABLE="true"
APPLET_DEFAULT_ENABLED="false"
APPLET_ADAPTER="mail"
APPLET_SUPPORT="experimental"
APPLET_CAPABILITIES="unread;latest_mail;"
APPLET_MATCH_HOSTS=""
